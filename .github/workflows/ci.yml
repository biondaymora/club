name: CI
on:
  pull_request:
  push:
    branches: [main, development]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The first dependency installation generates package-lock.json; commit it
      # and replace this with `npm ci` before enabling branch protection.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
